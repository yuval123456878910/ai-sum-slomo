# Render Blueprint (free plan): New → Blueprint → pick this repo.
# Free instances sleep after ~15 min idle and their disk is wiped, so:
#   - the database is saved to this GitHub repo on the "data" branch (GITHUB_TOKEN)
#   - .github/workflows/scan.yml wakes the site at 07:00 and 19:00 Israel time
services:
  - type: web
    name: stress-radar
    runtime: node
    plan: free
    region: frankfurt      # closest Render region to Israel
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENROUTER_API_KEY
        sync: false        # ← your OpenRouter key (set it on the service's Environment page)
      - key: OPENROUTER_MODEL
        value: auto        # or e.g. anthropic/claude-sonnet-5.5, openai/gpt-5, google/gemini-2.5-pro
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # ← password for the site login
      - key: GITHUB_REPO
        value: yuval123456878910/ai-sum-slomo
      - key: GITHUB_DATA_BRANCH
        value: data
      - key: GITHUB_TOKEN
        sync: false        # ← fine-grained token: this repo only, Contents read & write
      - key: CRON_SECRET
        generateValue: true  # copy this value into the GitHub secret CRON_SECRET
