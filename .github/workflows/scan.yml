# Wakes the Render free instance at 07:00 and 19:00 Israel time and starts the scan.
# GitHub cron is UTC and Israel is UTC+2 (winter) or UTC+3 (summer), so it calls at
# both possible UTC hours; the site runs each slot only once and ignores the extra call.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL    e.g. https://stress-radar.onrender.com
#   CRON_SECRET same value as CRON_SECRET in the Render service's Environment
name: Scheduled scan

on:
  schedule:
    - cron: '0 4,5,16,17 * * *'
  workflow_dispatch: # "Run workflow" button = scan now (ignores the time window)

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the site and start the scan
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the SITE_URL and CRON_SECRET repository secrets."; exit 1
          fi
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 120 -X POST \
              -H "X-Cron-Token: $CRON_SECRET" "${SITE_URL%/}/api/cron?force=$FORCE") || code=000
            echo "attempt $i: HTTP $code $(cat out.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            [ "$code" = "401" ] && { echo "::error::CRON_SECRET does not match the Render service."; exit 1; }
            sleep 30
          done
          echo "::error::Site did not respond."; exit 1
