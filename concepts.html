<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stress Radar Concepts</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #e9e9e6; color: #1a1a1a; }
  .intro { max-width: 1180px; margin: 0 auto; padding: 40px 16px 8px; }
  .intro h1 { margin: 0 0 6px; font-size: 28px; }
  .intro p { margin: 0; color: #555; max-width: 720px; line-height: 1.5; }
  .jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .jump a { text-decoration: none; color: #1a1a1a; background: #fff; border: 1px solid #ccc; border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
  .jump i { display: inline-flex; height: 10px; width: 50px; border-radius: 3px; overflow: hidden; }
  .jump i b { flex: 1; }

  .concept { max-width: 1180px; margin: 36px auto; padding: 0 16px; }
  .label { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .label h2 { margin: 0; font-size: 20px; }
  .label h2 small { font-weight: 500; color: #666; font-size: 13px; margin-left: 8px; }
  .label .who { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: #fff; border: 1px solid #ccc; }
  .label .who.mine { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .swatches { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .swatches span { flex: 1; display: flex; align-items: flex-end; padding: 4px 6px; font: 500 10px 'IBM Plex Mono', monospace; }
  .why { font-size: 13.5px; color: #444; margin: 0 0 14px; line-height: 1.5; max-width: 860px; }

  /* ---------- the mock app, driven by per-concept tokens ---------- */
  .app { background: var(--bg); color: var(--text); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px -24px rgba(0,0,0,.45); font-family: var(--font, 'IBM Plex Sans'), sans-serif; }
  .app .strip { height: 5px; background: var(--strip); }
  .app header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px; background: var(--head-bg); color: var(--head-text); flex-wrap: wrap; }
  .app .brand { display: flex; align-items: center; gap: 12px; }
  .app .logo { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--head-text); position: relative; flex: none; }
  .app .logo::before { content: ''; position: absolute; inset: 7px; border: 2px solid var(--head-text); border-radius: 50%; opacity: .55; }
  .app .logo::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--hot); }
  .app h3.title { margin: 0; font: 700 19px/1.1 var(--display, 'IBM Plex Sans'), sans-serif; letter-spacing: -.01em; }
  .app .sub { margin: 2px 0 0; font-size: 12px; opacity: .72; }
  .app .hr { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .app .pill { font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--head-line); display: inline-flex; gap: 7px; align-items: center; }
  .app .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .app .btn { font: 600 13px inherit; font-family: inherit; padding: 8px 14px; border-radius: var(--radius); border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .app nav { display: flex; gap: 4px; padding: 0 22px; background: var(--head-bg); border-bottom: 1px solid var(--line); }
  .app nav span { font-size: 13px; padding: 10px 12px; color: var(--head-text); opacity: .7; border-bottom: 2px solid transparent; }
  .app nav span.on { opacity: 1; font-weight: 600; border-color: var(--hot); }
  .app main { padding: 20px 22px 24px; }
  .app .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
  .app .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .app .stat .n { font: 600 26px/1 var(--display, 'IBM Plex Sans'), sans-serif; }
  .app .stat .l { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .app .stat.hotbox { background: var(--hot-soft); border-color: var(--hot); }
  .app .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .app .chip { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--text); }
  .app .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .app .chip em { font-style: normal; opacity: .6; margin-left: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .app .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .app .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .app .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .app .co { font-weight: 700; font-size: 16px; }
  .app .he { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .app .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .app .tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--text); }
  .app .tag.primary { background: var(--accent); color: var(--accent-ink); }
  .app .tag.new { background: var(--hot); color: var(--hot-ink); font-weight: 600; }
  .app .score { text-align: center; flex: none; }
  .app .score .ring { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--sc) calc(var(--v) * 10%), var(--surface-2) 0); }
  .app .score .ring b { width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font: 700 17px var(--display, 'IBM Plex Sans'), sans-serif; }
  .app .score small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .app .headline { font-size: 13.5px; line-height: 1.45; margin: 0; }
  .app .sig { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .app .sig li { font-size: 12.5px; display: grid; grid-template-columns: 74px 1fr; gap: 8px; color: var(--text); }
  .app .sig time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); padding-top: 1px; }
  .app .chain { display: flex; align-items: stretch; gap: 0; font-size: 11.5px; border: 1px dashed var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .app .chain div { flex: 1; padding: 7px 9px; background: var(--surface-2); position: relative; }
  .app .chain div + div { border-left: 1px solid var(--line-strong); }
  .app .chain div b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
  .app .chain div:first-child { background: var(--hot-soft); }
  .app .foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; gap: 8px; flex-wrap: wrap; }
  .app .foot a { color: var(--link); }
  .demo-note { font-size: 11px; color: var(--muted); margin-top: 14px; }

  @media (max-width: 760px) {
    .app .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .app .grid { grid-template-columns: 1fr; }
    .app header, .app main { padding-left: 16px; padding-right: 16px; }
    .app nav { padding: 0 10px; overflow-x: auto; }
  }

  /* ---------- 1. Deep Sea (yours) ---------- */
  .c-deep { --bg:#eff6e0; --surface:#ffffff; --surface-2:#e4eed8; --text:#01161e; --muted:#46707f; --line:#cddbc6; --line-strong:#aec3b0;
    --head-bg:#01161e; --head-text:#eff6e0; --head-line:#2d5868; --accent:#124559; --accent-ink:#eff6e0; --hot:#598392; --hot-ink:#fff; --hot-soft:#e0ebe2;
    --ok:#aec3b0; --link:#124559; --radius:10px; --strip:linear-gradient(90deg,#01161e,#124559,#598392,#aec3b0,#eff6e0); }
  /* ---------- 2. Oxblood Ledger (yours) ---------- */
  .c-oxblood { --bg:#f2f4f3; --surface:#ffffff; --surface-2:#ece6df; --text:#0a0908; --muted:#5e503f; --line:#ddd3c8; --line-strong:#a9927d;
    --head-bg:#0a0908; --head-text:#f2f4f3; --head-line:#5e503f; --accent:#49111c; --accent-ink:#f2f4f3; --hot:#49111c; --hot-ink:#f2f4f3; --hot-soft:#f1e6e3;
    --ok:#a9927d; --link:#49111c; --radius:3px; --display:'Fraunces'; --strip:linear-gradient(90deg,#0a0908,#49111c,#5e503f,#a9927d,#f2f4f3); }
  /* ---------- 3. Signal Green (yours) ---------- */
  .c-green { --bg:#f7f9ea; --surface:#ffffff; --surface-2:#eef4d4; --text:#0c2b1f; --muted:#3f6145; --line:#dbe7b4; --line-strong:#aacc00;
    --head-bg:#007f5f; --head-text:#ffffff; --head-line:#55a630; --accent:#2b9348; --accent-ink:#ffffff; --hot:#dddf00; --hot-ink:#0c2b1f; --hot-soft:#fbfbd0;
    --ok:#ffff3f; --link:#007f5f; --radius:14px; --display:'Space Grotesk';
    --strip:linear-gradient(90deg,#007f5f,#2b9348,#55a630,#80b918,#aacc00,#bfd200,#d4d700,#dddf00,#eeef20,#ffff3f); }
  /* ---------- 4. Midnight Slate (pick) ---------- */
  .c-midnight { --bg:#0d1b2a; --surface:#1b263b; --surface-2:#243250; --text:#e0e1dd; --muted:#9aaac2; --line:#2c3b57; --line-strong:#415a77;
    --head-bg:#0d1b2a; --head-text:#e0e1dd; --head-line:#415a77; --accent:#778da9; --accent-ink:#0d1b2a; --hot:#e0e1dd; --hot-ink:#0d1b2a; --hot-soft:#2a3a58;
    --ok:#778da9; --link:#b8c6da; --radius:8px; color-scheme: dark; --strip:linear-gradient(90deg,#0d1b2a,#1b263b,#415a77,#778da9,#e0e1dd); }
  /* ---------- 5. Ember Alert (pick) ---------- */
  .c-ember { --bg:#fbf7ef; --surface:#ffffff; --surface-2:#f6eedc; --text:#264653; --muted:#557079; --line:#eedfc0; --line-strong:#e9c46a;
    --head-bg:#264653; --head-text:#fbf7ef; --head-line:#3d6774; --accent:#2a9d8f; --accent-ink:#ffffff; --hot:#e76f51; --hot-ink:#ffffff; --hot-soft:#fde8df;
    --ok:#e9c46a; --link:#1f7a6f; --radius:10px; --strip:linear-gradient(90deg,#264653,#2a9d8f,#e9c46a,#f4a261,#e76f51); }
</style>
</head>
<body>
<div class="intro">
  <h1>Stress Radar: five palette concepts</h1>
  <p>Same dashboard, five looks. Three palettes are yours; the last two are my picks. Each one shows the findings screen the bot fills after its 07:00 / 19:00 scan. The company data is made up, to show the layout.</p>
  <div class="jump" id="jump"></div>
</div>
<div id="concepts"></div>

<script>
const concepts = [
  { id:'deep', cls:'c-deep', name:'1 · Deep Sea', tag:'Calm analyst', mine:false,
    colors:['01161e','124559','598392','aec3b0','eff6e0'],
    why:'Navy header and soft sage background. Easy on the eyes for long reading sessions; feels like a research terminal more than an alarm panel.' },
  { id:'oxblood', cls:'c-oxblood', name:'2 · Oxblood Ledger', tag:'Private-bank / legal', mine:false,
    colors:['0a0908','49111c','f2f4f3','a9927d','5e503f'],
    why:'Black and oxblood with a serif display face and sharp corners. Reads like a deal memo or a law-firm brief: serious and expensive.' },
  { id:'green', cls:'c-green', name:'3 · Signal Green', tag:'Bold, energetic', mine:false,
    colors:['007f5f','2b9348','55a630','80b918','aacc00','bfd200','d4d700','dddf00','eeef20','ffff3f'],
    why:'The ten-step gradient becomes the deal-score scale (dark green = cold, yellow = hot). Very distinctive, but yellow on white needs dark text around it.' },
  { id:'midnight', cls:'c-midnight', name:'4 · Midnight Slate', tag:'My pick: dark mode', mine:true,
    colors:['0d1b2a','1b263b','415a77','778da9','e0e1dd'],
    why:'A full dark theme in cool blue-greys. Good for a screen you check at 7 pm, and it keeps the high-score items bright against a quiet background.' },
  { id:'ember', cls:'c-ember', name:'5 · Ember Alert', tag:'My pick: risk heat scale', mine:true,
    colors:['264653','2a9d8f','e9c46a','f4a261','e76f51'],
    why:'Teal for interface, then yellow → orange → coral as a natural "heat" scale for stress and deal score. The clearest at-a-glance urgency of the five.' },
];

// demo data (fictional companies)
const scoreColor = {
  deep:v=>v>=7?'#124559':v>=4?'#598392':'#aec3b0',
  oxblood:v=>v>=7?'#49111c':v>=4?'#5e503f':'#a9927d',
  green:v=>['#007f5f','#2b9348','#55a630','#80b918','#aacc00','#bfd200','#d4d700','#dddf00','#eeef20','#eeef20'][Math.max(0,v-1)],
  midnight:v=>v>=7?'#e0e1dd':v>=4?'#778da9':'#415a77',
  ember:v=>v>=7?'#e76f51':v>=4?'#f4a261':'#e9c46a',
};
const cards = [
  { co:'Galil Polymers Ltd.', he:'גליל פולימרים בע"מ', primary:'Plastics', other:['Packaging'], type:'Family', loc:'Karmiel industrial zone', score:8, deal:'Real estate + business', isNew:true,
    headline:'Bank lowered credit line after loss of a European irrigation customer; night shift cut at the injection-molding plant.',
    sig:[['2026-11-12','Bank: credit line cut by ₪18M'],['2026-11-10','Night shift stopped, 40 workers on leave'],['2026-11-04','Main EU drip-irrigation contract not renewed']],
    chain:['EU export customer','Drip parts orders −35%','Mold makers in Karmiel']},
  { co:'Negev Metal Works', he:'מתכת הנגב', primary:'Metal', other:[], type:'Kibbutz', loc:'Kibbutz plant, Western Negev', score:5, deal:'Business', isNew:false,
    headline:'Aluminum profile supplier raised prices; delayed shipments through a foreign port squeeze margins on a public tender.',
    sig:[['2026-11-11','Supplier price rise of 12% on profiles'],['2026-11-07','Tender terms changed: penalties for late delivery']],
    chain:['Aluminum supplier','Margin squeeze on tender','Coating subcontractors']},
];

const html = (c) => `
<section class="concept" id="${c.id}">
  <div class="label"><h2>${c.name}<small>${c.tag}</small></h2><span class="who ${c.mine?'mine':''}">${c.mine?'Claude’s pick':'Your palette'}</span></div>
  <div class="swatches">${c.colors.map(h=>{const l=parseInt(h.slice(0,2),16)*.3+parseInt(h.slice(2,4),16)*.59+parseInt(h.slice(4,6),16)*.11;return `<span style="background:#${h};color:${l>140?'#111':'#fff'}">#${h}</span>`}).join('')}</div>
  <p class="why">${c.why}</p>
  <div class="app ${c.cls}">
    <div class="strip"></div>
    <header>
      <div class="brand"><span class="logo"></span><div><h3 class="title">Stress Radar</h3><p class="sub">Israeli industry · distress &amp; deal signals</p></div></div>
      <div class="hr"><span class="pill">Next scan 19:00 · Asia/Jerusalem</span><button class="btn">Run scan now</button></div>
    </header>
    <nav><span class="on">Findings</span><span>Scan log</span><span>Settings</span></nav>
    <main>
      <div class="stats">
        <div class="stat"><div class="n">23</div><div class="l">Companies, last 7 days</div></div>
        <div class="stat"><div class="n">9</div><div class="l">New since last scan</div></div>
        <div class="stat hotbox"><div class="n">4</div><div class="l">Deal score 7+</div></div>
        <div class="stat"><div class="n">5/5</div><div class="l">Sectors scanned at 07:00</div></div>
      </div>
      <div class="chips"><span class="chip on">All<em>23</em></span><span class="chip">Plastics<em>6</em></span><span class="chip">Food<em>4</em></span><span class="chip">Packaging<em>3</em></span><span class="chip">Chemicals<em>5</em></span><span class="chip">Metal<em>5</em></span></div>
      <div class="grid">${cards.map(k=>`
        <article class="card">
          <div class="card-top">
            <div><div class="co">${k.co}</div><div class="he" dir="rtl">${k.he}</div>
              <div class="tags"><span class="tag primary">${k.primary}</span>${k.other.map(o=>`<span class="tag">also ${o}</span>`).join('')}<span class="tag">${k.type}</span>${k.isNew?'<span class="tag new">NEW</span>':'<span class="tag">update</span>'}</div></div>
            <div class="score"><div class="ring" style="--v:${k.score};--sc:${scoreColor[c.id](k.score)}"><b>${k.score}</b></div><small>Deal</small></div>
          </div>
          <p class="headline">${k.headline}</p>
          <ul class="sig">${k.sig.map(s=>`<li><time>${s[0]}</time><span>${s[1]}</span></li>`).join('')}</ul>
          <div class="chain"><div><b>Hit link</b>${k.chain[0]}</div><div><b>Effect</b>${k.chain[1]}</div><div><b>Spreads to</b>${k.chain[2]}</div></div>
          <div class="foot"><span>${k.loc} · ${k.deal}</span><a href="#">3 sources</a></div>
        </article>`).join('')}
      </div>
      <div class="demo-note">Demo data: fictional companies.</div>
    </main>
  </div>
</section>`;

document.getElementById('concepts').innerHTML = concepts.map(html).join('');
document.getElementById('jump').innerHTML = concepts.map(c=>`<a href="#${c.id}"><i>${c.colors.map(h=>`<b style="background:#${h}"></b>`).join('')}</i>${c.name}</a>`).join('');
</script>
</body>
</html>
